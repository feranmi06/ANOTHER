<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet" href="../css/settings.css">

</head>

<body>

    <section class="settings-page">

        <!-- SIDEBAR -->
        <div class="settings-sidebar">

            <h2>
                My Account
            </h2>

            <ul>

                <li>
                    <a href="account.html">
                        🏠 Dashboard
                    </a>
                </li>

                <li class="active">
                    ⚙️ Settings
                </li>

                <li onclick="logout()">
                    🚪 Logout
                </li>

            </ul>

        </div>

        <!-- CONTENT -->
        <div class="settings-content">

            <h1>
                Account Settings ⚙️
            </h1>

            <!-- PROFILE -->
            <div class="settings-card">

                <h2>
                    Profile Information
                </h2>

                <div class="profile-upload">

                    <img
                    id="profile-preview"
                    src="../image/profile.jpg"
                    alt="">

                    <input
                    type="file"
                    id="profile-input"
                    aria-label="Upload profile photo">

                </div>

                <div class="input-group">

                    <label>
                        Full Name
                    </label>

                    <input
                    type="text"
                    id="name"
                    placeholder="Enter name">

                </div>

                <div class="input-group">

                    <label>
                        Email Address
                    </label>

                    <input
                    type="email"
                    id="email"
                    placeholder="Enter email">

                </div>

                <button onclick="saveProfile()">
                    Save Changes
                </button>

            </div>

            <!-- PASSWORD -->
            <div class="settings-card">

                <h2>
                    Change Password
                </h2>

                <div class="input-group">

                    <label>
                        Current Password
                    </label>

                    <input
                    type="password"
                    placeholder="Current password">

                </div>

                <div class="input-group">

                    <label>
                        New Password
                    </label>

                    <input
                    type="password"
                    placeholder="New password">

                </div>

                <button>
                    Update Password
                </button>

            </div>

        </div>

    </section>

    <script src="../js/settings.js"></script>

</body>
</html>
