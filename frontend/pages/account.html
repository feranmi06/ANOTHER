<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>My Account</title>

    <link rel="stylesheet" href="../css/account.css">

</head>

<body>

    <section class="account-page">

        <!-- SIDEBAR -->
        <div class="account-sidebar">

            <div class="profile-box">

                <img
                src="../image/profile.jpg"
                alt="">

                <h2 id="username">
                    Hello John 👋
                </h2>

            </div>
                <ul>

    <li>
        <a href="index.html">

            🏠 Dashboard

        </a>
    </li>

    <li onclick="openOrders()">

        📦 My Orders

    </li>

    <li onclick="openSettings()">
        <a href="settings.html">
            ⚙️ Settings
        </a>
    </li>

    <li onclick="logout()">

        🚪 Logout

    </li>

</ul>
            
        </div>

        <!-- CONTENT -->
        <div class="account-content">

            <h1>
                My Dashboard
            </h1>

            <!-- CARDS -->
            <div class="dashboard-cards">

                <div class="dashboard-card">

                    <h3>
                        Total Orders
                    </h3>

                    <p>
                        12
                    </p>

                </div>

                <div class="dashboard-card">

                    <h3>
                        Wishlist
                    </h3>

                    <p>
                        5
                    </p>

                </div>

                <div class="dashboard-card">

                    <h3>
                        Cart Items
                    </h3>

                    <p id="cart-count">
                        0
                    </p>

                </div>

            </div>

            <!-- RECENT -->
            <div class="recent-orders">

                <h2>
                    Recent Orders
                </h2>

                <div class="order">

                    <img
                    src="../image/dress.jpg"
                    alt="">

                    <div>

                        <h3>
                            Luxury Pink Dress
                        </h3>

                        <p>
                            ₦25,000
                        </p>

                    </div>

                    <span class="status">
                        Delivered
                    </span>

                </div>

            </div>

        </div>

    </section>

    <script src="../js/api.js"></script>
<script src="../js/account.js"></script>

</body>
</html>
